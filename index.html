    <script>
      // Gracefully handle Vite HMR WebSocket connection closed / disabled-HMR warning in iframe dev previews
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason && typeof e.reason.message === 'string' ? e.reason.message : String(e.reason || '');
        if (msg.includes('WebSocket closed') || msg.includes('SendBeforeConnectError') || msg.includes('send was called before connect')) {
          e.preventDefault();
        }
      });
    </script>
