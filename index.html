    <script>
      // Gracefully handle Vite HMR WebSocket connection closed warning in iframe dev previews
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (typeof e.reason.message === 'string' && e.reason.message.includes('WebSocket closed') || String(e.reason).includes('WebSocket closed'))) {
          e.preventDefault();
        }
      });
    </script>
